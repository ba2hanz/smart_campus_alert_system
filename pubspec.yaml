name: smart_campus_alert_system
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # --- KRİTİK DÜZELTME (Windows İçin Altın Sürümler) ---
  # Bu sürümler Visual Studio derleyicisi ile %100 uyumludur.
  # Başlarında ^ işareti yoktur, kesinlikle bu sürümler inecektir.
  firebase_core: 2.23.0
  firebase_auth: 4.14.1
  cloud_firestore: 4.13.2
  firebase_storage: 11.5.2
  # -----------------------------------------------------

  # Harita ve Konum
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0

  # Resim Seçme
  image_picker: ^1.0.7

  # Tarih Formatlama
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true